  name: NotConstraint
  nameWithType: NotConstraint
  fullName: E7.Minefield.NotConstraint
  type: Class
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Inverts another <xref href="E7.Minefield.BeaconConstraint" data-throw-if-not-resolved="false"></xref>. Create it with the <code>!</code> operator on any

    Minefield constraint, e.g. <code>!Is.Clickable</code> or <code>!Is.Active</code>, so you can wait for or

    assert the *absence* of a condition — a button that must stay locked mid-transition, an element

    that must disappear, and so on.


    The <code>!</code> operator is used instead of shadowing NUnit's <code>Is.Not</code>, because Minefield's

    <code>Is</code> inherits from <code>NUnit.Framework.Is</code> and hiding <code>Is.Not</code> would break ordinary

    NUnit expressions like <code>Is.Not.Null</code>.


    Example:


    <pre><code class="lang-csharp">// Confirm the button is unclickable while the popup animates in.

    yield return Beacon.WaitUntil(Screen.Navigation.Confirm, !Is.Clickable);

    Assert.Beacon(Screen.Beacon.Portrait, !Is.Active);</code></pre>
  example: []
  syntax:
    content: 'public class NotConstraint : BeaconConstraint'
    content.vb: Public Class NotConstraint Inherits BeaconConstraint

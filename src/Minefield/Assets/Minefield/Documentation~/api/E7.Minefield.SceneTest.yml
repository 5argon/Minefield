- uid: E7.Minefield.SceneTest.ActivateScene
  commentId: M:E7.Minefield.SceneTest.ActivateScene
  id: ActivateScene
  parent: E7.Minefield.SceneTest
  langs:
  - csharp
  - vb
  name: ActivateScene()
  nameWithType: SceneTest.ActivateScene()
  fullName: E7.Minefield.SceneTest.ActivateScene()
  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: To begin test, call this after you finish setting up things.
  remarks: >-
    Important notes about scene activation : 

    - On begin loading, the progress is always 0.

    - Allow activation or not, the next scene it could be at most progress 0.9

    - If allowed activation while the progress is 0.9, the **next frame**

    is where awake and start will be called.

    - (6/6/2019) There is a bug where if you pause and stepping frame,

    at the activation moment Awake will immediately come, then Start the next frame. (wtf)


    So it take a minimum of 3 frames to get a scene that you could query game objects.


    * For any reason, you must call this somewhere in the test case,

    because it have to be paired with scene loading that was done

    automatically for you at setup. Or else there will be a scene stuck at near-complete state

    that could wreck the next test.


    For example if you want to call `Assert.Ignore` to early out,

    do it after the scene activated so the next case could start cleanly.
  example: []
  syntax:
    content: protected IEnumerator ActivateScene()
    return:
      type: System.Collections.IEnumerator
    content.vb: Protected Function ActivateScene() As IEnumerator
  overload: E7.Minefield.SceneTest.ActivateScene*
- uid: E7.Minefield.SceneTest.RestartScene
  commentId: M:E7.Minefield.SceneTest.RestartScene
  id: RestartScene
  parent: E7.Minefield.SceneTest
  langs:
  - csharp
  - vb
  name: RestartScene()
  nameWithType: SceneTest.RestartScene()
  fullName: E7.Minefield.SceneTest.RestartScene()
  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Useful when you want to run the scene again fresh in the same test case, perhaps keeping some

    evaluation result in a variable to compare with a new run. Remember that this do not include your

    `[SetUp]` logic. Which is useful for example, you want to test if what you did previously is properly

    persisted by the save file or not.
  example: []
  syntax:
    content: protected IEnumerator RestartScene()
    return:
      type: System.Collections.IEnumerator
    content.vb: Protected Function RestartScene() As IEnumerator
  overload: E7.Minefield.SceneTest.RestartScene*

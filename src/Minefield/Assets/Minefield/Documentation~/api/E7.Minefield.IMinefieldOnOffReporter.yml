- uid: E7.Minefield.IMinefieldOnOffReporter
  commentId: T:E7.Minefield.IMinefieldOnOffReporter
  id: IMinefieldOnOffReporter
  parent: E7.Minefield
  children:
  - E7.Minefield.IMinefieldOnOffReporter.IsOn
  langs:
  - csharp
  - vb
  name: IMinefieldOnOffReporter
  nameWithType: IMinefieldOnOffReporter
  fullName: E7.Minefield.IMinefieldOnOffReporter
  type: Interface
  assemblies:
  - E7.Minefield
  namespace: E7.Minefield
  summary: >-
    Use a new wording "on" or "off" to provide your own interpretation of the current status of a game object.

    It could be used with Is.On or Is.Off constraint in the test.


    For example an image made invisible by setting <xref href="UnityEngine.Behaviour.enabled" data-throw-if-not-resolved="false"></xref> 

    would not be detected by Is.Active.


    A text component may be active and enabled,

    but if they have no text, you may consider it invisible.


    The button is active, visible, but greyed out, you may want to consider it inactive.


    Lastly, an image that is active, enabled, and its alpha is not even 0, but is invisible due to its <xref href="UnityEngine.CanvasGroup" data-throw-if-not-resolved="false"></xref>'s alpha.

    This case is very hard to detect automatically by testint lib, so it is better to just provide your own logic.
  example: []
  syntax:
    content: 'public interface IMinefieldOnOffReporter : IMinefieldReporter'
    content.vb: Public Interface IMinefieldOnOffReporter Inherits IMinefieldReporter

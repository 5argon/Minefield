  name.vb: WaitUntil(Of T)(T, BeaconConstraint, Single)
- uid: E7.Minefield.Beacon.SpamUntil``1(``0,E7.Minefield.BeaconConstraint,System.Func{System.Collections.IEnumerator})
  commentId: M:E7.Minefield.Beacon.SpamUntil``1(``0,E7.Minefield.BeaconConstraint,System.Func{System.Collections.IEnumerator})
  id: SpamUntil``1(``0,E7.Minefield.BeaconConstraint,System.Func{System.Collections.IEnumerator})
  parent: E7.Minefield.Beacon
  langs:
  - csharp
  - vb
  name: SpamUntil<T>(T, BeaconConstraint, Func<IEnumerator>)
  nameWithType: Beacon.SpamUntil<T>(T, BeaconConstraint, Func<IEnumerator>)
  fullName: E7.Minefield.Beacon.SpamUntil<T>(T, E7.Minefield.BeaconConstraint, System.Func<System.Collections.IEnumerator>)
  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Until the constraint returns `true`, repeat the action.


    The action could spans multiple frames because it works like a coroutine function.

    The constraint check occur again when the <code class="paramref">spamAction</code> has completed all of its frames.


    This is useful to create a "dumb AI" where normally complex actions are required to get through the scene, 

    but a simple spam without considering any timing could also do so in a less ideal way.


    For example, testing a Mario stage with an objective if you could respawn after death or not, 

    could be simplified to holding right and jump repeatedly.

    You are bound to die sooner or later that way. Then you could use this test regardless of stages.
  example: []
  syntax:
    content: 'public static IEnumerator SpamUntil<T>(T beacon, BeaconConstraint bc, Func<IEnumerator> spamAction) where T : Enum'
    parameters:
    - id: beacon
      type: '{T}'
    - id: bc
      type: E7.Minefield.BeaconConstraint
    - id: spamAction
      type: System.Func{System.Collections.IEnumerator}
    typeParameters:
    - id: T
    return:
      type: System.Collections.IEnumerator
    content.vb: Public Shared Function SpamUntil(Of T As [Enum])(beacon As T, bc As BeaconConstraint, spamAction As Func(Of IEnumerator)) As IEnumerator

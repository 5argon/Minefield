- uid: E7.Minefield.Beacon.DefaultTimeout
  commentId: F:E7.Minefield.Beacon.DefaultTimeout
  id: DefaultTimeout
  parent: E7.Minefield.Beacon
  langs:
  - csharp
  - vb
  name: DefaultTimeout
  nameWithType: Beacon.DefaultTimeout
  fullName: E7.Minefield.Beacon.DefaultTimeout
  type: Field
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Default timeout (seconds, unscaled) applied to <xref href="E7.Minefield.Beacon.WaitUntil%60%601(%60%600%2cE7.Minefield.BeaconConstraint%2cSystem.Single)" data-throw-if-not-resolved="false"></xref>

    and <xref href="E7.Minefield.Beacon.ClickWhen%60%601(%60%600%2cE7.Minefield.BeaconConstraint%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> when no per-call timeout is given.


    This stops a mistyped or never-satisfiable wait from hanging silently until the test runner's

    global timeout and then failing with an unhelpful message. Instead you get a diagnostic that

    explains *why* the constraint never passed. 30s is generous for UI navigation; raise it, lower

    it, or set it to <xref href="System.Single.PositiveInfinity" data-throw-if-not-resolved="false"></xref> to restore the old wait-forever behaviour.

    A per-call value always wins over this. The "play button" pattern uses <xref href="E7.Minefield.Utility.WaitForever" data-throw-if-not-resolved="false"></xref>,

    which is unaffected.
  example: []
  syntax:
    content: public static float DefaultTimeout
    return:
      type: System.Single
    content.vb: Public Shared DefaultTimeout As Single
- uid: E7.Minefield.Beacon.WaitUntil``1(``0,E7.Minefield.BeaconConstraint,System.Single)
  commentId: M:E7.Minefield.Beacon.WaitUntil``1(``0,E7.Minefield.BeaconConstraint,System.Single)
  id: WaitUntil``1(``0,E7.Minefield.BeaconConstraint,System.Single)
  parent: E7.Minefield.Beacon
  langs:
  - csharp
  - vb
  name: WaitUntil<T>(T, BeaconConstraint, float)
  nameWithType: Beacon.WaitUntil<T>(T, BeaconConstraint, float)
  fullName: E7.Minefield.Beacon.WaitUntil<T>(T, E7.Minefield.BeaconConstraint, float)
  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Remember that base condition for all constraints is that the beacon must be found,

    and to be found the game object must be active.


    It will not fail the test if the constraint doesn't happen yet,

    please check manually if you really have that type of

    beacon in the scene or it would wait forever when you actually forgot to add the beacon.

    (Unlike assertion where you immediately get

    an error message telling you about missing beacon.)
  example: []
  syntax:
    content: 'public static IEnumerator WaitUntil<T>(T beacon, BeaconConstraint bc, float timeout = -1) where T : Enum'
    parameters:
    - id: beacon
      type: '{T}'
    - id: bc
      type: E7.Minefield.BeaconConstraint
    - id: timeout
      type: System.Single
      description: >-
        Seconds (unscaled) to wait before failing with a diagnostic. Negative uses

        <xref href="E7.Minefield.Beacon.DefaultTimeout" data-throw-if-not-resolved="false"></xref>; pass <xref href="System.Single.PositiveInfinity" data-throw-if-not-resolved="false"></xref> to wait forever.
    typeParameters:
    - id: T
    return:
      type: System.Collections.IEnumerator
    content.vb: Public Shared Function WaitUntil(Of T As [Enum])(beacon As T, bc As BeaconConstraint, timeout As Single = -1) As IEnumerator

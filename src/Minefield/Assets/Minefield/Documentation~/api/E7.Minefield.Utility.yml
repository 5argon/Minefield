- uid: E7.Minefield.Utility.CleanTestScene
  commentId: M:E7.Minefield.Utility.CleanTestScene
  id: CleanTestScene
  parent: E7.Minefield.Utility
  langs:
  - csharp
  - vb
  name: CleanTestScene()
  nameWithType: Utility.CleanTestScene()
  fullName: E7.Minefield.Utility.CleanTestScene()
  type: Method
  assemblies:
  - E7.Minefield
  namespace: E7.Minefield
  summary: >-
    Clean everything except the test runner object.


    This actually demolish only the active scene at the time of test case ending, if you follow

    Minefield's guidelines you will have only 1 active scene at all time, and so it is easy to

    clean up. DontDestroyOnLoad scene will be untouched.
  example: []
  syntax:
    content: public static void CleanTestScene()
    content.vb: Public Shared Sub CleanTestScene()

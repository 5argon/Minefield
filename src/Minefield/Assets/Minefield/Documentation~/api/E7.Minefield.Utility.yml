- uid: E7.Minefield.Utility.RaycastClick(UnityEngine.Vector2)
  commentId: M:E7.Minefield.Utility.RaycastClick(UnityEngine.Vector2)
  id: RaycastClick(UnityEngine.Vector2)
  parent: E7.Minefield.Utility
  langs:
  - csharp
  - vb
  name: RaycastClick(Vector2)
  nameWithType: Utility.RaycastClick(Vector2)
  fullName: E7.Minefield.Utility.RaycastClick(UnityEngine.Vector2)
  type: Method
  assemblies:
  - E7.Minefield
  namespace: E7.Minefield
  summary: >-
    Simulate a click. Definition of a click is pointer down this frame

    then up at the same coordinate the next frame. So you need a coroutine on this.


    After finding the first object that blocks the ray, if that object do not have down, up,

    or click event it will be bubble up until finding someone that could handle it.


    It is still possible to produce impossible action, such as clicking 2 times on the same button.

    Even with coroutine, the up of the first click will be at

    the same frame as down of the next one. This is not physically possible.

    So if you need to double click, wait a frame manually.
  example: []
  syntax:
    content: public static IEnumerator RaycastClick(Vector2 screenPosition)
    parameters:
    - id: screenPosition
      type: UnityEngine.Vector2
      description: In pixel.
    return:
      type: System.Collections.IEnumerator
    content.vb: Public Shared Function RaycastClick(screenPosition As Vector2) As IEnumerator
  overload: E7.Minefield.Utility.RaycastClick*

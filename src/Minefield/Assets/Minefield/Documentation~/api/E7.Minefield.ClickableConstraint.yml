  fullName: E7.Minefield.ClickableConstraint.Diagnostic()
  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Human-readable explanation of *why* this constraint currently fails, surfaced by

    <xref href="E7.Minefield.Beacon.WaitUntil%60%601(%60%600%2cE7.Minefield.BeaconConstraint%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> when it times out. Call

    <xref href="E7.Minefield.BeaconConstraint.ApplyToBeacon%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> first so the state below is populated.

    Override to give a more specific reason (see <xref href="E7.Minefield.ClickableConstraint" data-throw-if-not-resolved="false"></xref>).

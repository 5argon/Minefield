items:
- uid: E7.Minefield.ClickableConstraint
  commentId: T:E7.Minefield.ClickableConstraint
  id: ClickableConstraint
  parent: E7.Minefield
  children:
  - E7.Minefield.ClickableConstraint.Assert
  - E7.Minefield.ClickableConstraint.Diagnostic
  langs:
  - csharp
  - vb
  name: ClickableConstraint
  nameWithType: ClickableConstraint
  fullName: E7.Minefield.ClickableConstraint
  type: Class
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: "\"Clickable\" is :\n\n- Has `RectTransform`, `Collider2D`, or `Collider`. Which it will use the center coordinate of that component to click. (<xref href=\"E7.Minefield.HandlerBeacon\" data-throw-if-not-resolved=\"false\"></xref> ensure this.)\n\n- Something must be able to happen on click, \nExpected object must be able to handle **at least one of** <xref href=\"UnityEngine.EventSystems.IPointerDownHandler\" data-throw-if-not-resolved=\"false\"></xref>, <xref href=\"UnityEngine.EventSystems.IPointerUpHandler\" data-throw-if-not-resolved=\"false\"></xref>, or <xref href=\"UnityEngine.EventSystems.IPointerClickHandler\" data-throw-if-not-resolved=\"false\"></xref>.\n\n- A raycast to the center of that coordinate, hit this object **first**, that is <xref href=\"UnityEngine.UI.Graphic.depth\" data-throw-if-not-resolved=\"false\"></xref> is highest.\n(However even if it came first, it could be skipped with <xref href=\"UnityEngine.UI.Graphic.raycastTarget\" data-throw-if-not-resolved=\"false\"></xref> `false` or <xref href=\"UnityEngine.CanvasGroup.blocksRaycasts\" data-throw-if-not-resolved=\"false\"></xref> `false`.) \n\n- OR if the raycast blocker is not the expected object, if one of the 3 aforementioned events bubbles up and lands on the expected object\nthen it is considered clickable.\n\nImagine a Button with <xref href=\"UnityEngine.UI.Graphic.raycastTarget\" data-throw-if-not-resolved=\"false\"></xref>, and a nested Text that **also** has <xref href=\"UnityEngine.UI.Graphic.raycastTarget\" data-throw-if-not-resolved=\"false\"></xref>. (As is the case\nof a default uGUI button) when you click it, the text blocks the ray and not the button that has the actual event handler, yet the button manages to be\nthe one that handle the event. This is an example of bubbling up that Minefield could also simulate.\n\n- **If** it is <xref href=\"UnityEngine.UI.Selectable\" data-throw-if-not-resolved=\"false\"></xref>, it must **also** be <xref href=\"UnityEngine.UI.Selectable.IsInteractable\" data-throw-if-not-resolved=\"false\"></xref>. (This could be prevented with <xref href=\"UnityEngine.CanvasGroup.interactable\" data-throw-if-not-resolved=\"false\"></xref> `false` or <xref href=\"UnityEngine.UI.Selectable.interactable\" data-throw-if-not-resolved=\"false\"></xref>)"
  example: []
  syntax:
    content: 'public class ClickableConstraint : BeaconConstraint'
    content.vb: Public Class ClickableConstraint Inherits BeaconConstraint

  name: GraphicVisible(Graphic)
  nameWithType: UGUITestExtension.GraphicVisible(Graphic)
  fullName: E7.Minefield.UGUITestExtension.GraphicVisible(UnityEngine.UI.Graphic)
  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    An extension method to check visually can we see the graphic or not.

    It does not check for null Sprite since that will be rendered as a white rectangle.

    It does not check for transparency resulting from parent CanvasGroup.

    For Text, it does not account for empty text or truncated text.
  example: []
  syntax:
    content: public static bool GraphicVisible(this Graphic graphic)
    parameters:
    - id: graphic
      type: UnityEngine.UI.Graphic
    return:
      type: System.Boolean
    content.vb: Public Shared Function GraphicVisible(graphic As Graphic) As Boolean
  overload: E7.Minefield.UGUITestExtension.GraphicVisible*

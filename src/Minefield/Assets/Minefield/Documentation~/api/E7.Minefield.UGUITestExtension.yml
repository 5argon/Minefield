  type: Method
  assemblies:
  - E7.Minefield.TestTools
  namespace: E7.Minefield
  summary: >-
    Searches all layers of Animator of this GameObject does any of them at a specified state name?

    Specify layerIndex to look in only one layer.

    If you just issue a SetTrigger to change state for example, one frame is required to make it take effect.
  example: []
  syntax:
    content: public static bool AnimatorAtState(this Component go, string stateName, int layerIndex = -1)
    parameters:
    - id: go
      type: UnityEngine.Component
    - id: stateName
      type: System.String
    - id: layerIndex
      type: System.Int32
    return:
      type: System.Boolean
    content.vb: Public Shared Function AnimatorAtState(go As Component, stateName As String, layerIndex As Integer = -1) As Boolean
